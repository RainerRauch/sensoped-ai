name: Deploy SENSOPED AI Worker (development)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: sensoped-ai-neuentwicklung

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate deployment configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ORIGIN: ${{ vars.SENSOPED_AI_PREVIEW_ORIGIN }}
        run: |
          test -n "$CF_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$APP_ORIGIN" || (echo "Missing SENSOPED_AI_PREVIEW_ORIGIN" && exit 1)
          case "$APP_ORIGIN" in https://*) ;; *) echo "Origin must start with https://" && exit 1 ;; esac

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var ALLOWED_ORIGIN:${{ vars.SENSOPED_AI_PREVIEW_ORIGIN }}

