name: Daily SENSOPED AI backup

on:
  push:
    branches:
      - sensoped-ai-neuentwicklung
  schedule:
    - cron: '0 2 * * *' # Schedule is active only from the default branch.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sensoped-ai-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: sensoped-ai-neuentwicklung
          fetch-depth: 0

      - name: Create dated restore tag
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG="backup-$(date -u +%Y-%m-%d)-$(git rev-parse --short=12 HEAD)"
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"

          if [ -n "$REMOTE_TAG" ]; then
            if [ "$REMOTE_TAG" = "$HEAD_SHA" ]; then
              echo "Backup tag $TAG already points to this HEAD; leaving it unchanged."
              exit 0
            fi
            echo "Backup tag $TAG exists but points to a different commit; refusing to overwrite it."
            exit 1
          fi

          git tag "$TAG" HEAD
          if git push origin "$TAG"; then
            echo "Created $TAG at $HEAD_SHA."
          else
            REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            if [ "$REMOTE_TAG" = "$HEAD_SHA" ]; then
              echo "Concurrent backup created the same tag at the same HEAD; treating it as success."
              exit 0
            fi
            echo "Backup push failed and the remote tag does not match this HEAD."
            exit 1
          fi
