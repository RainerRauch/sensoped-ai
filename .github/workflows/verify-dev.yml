name: Verify SENSOPED AI development branch
on:
  push:
    branches:
      - sensoped-ai-neuentwicklung
  pull_request:
    branches:
      - sensoped-ai-neuentwicklung
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
      - name: Upload development build for testing
        uses: actions/upload-artifact@v4
        with:
          name: sensoped-ai-development-preview
          path: dist
          retention-days: 14
