name: Verify SENSOPED AI backup integrity

on:
  workflow_dispatch:
  push:
    branches: [sensoped-ai-neuentwicklung]
    paths:
      - ".github/workflows/verify-backup.yml"
      - "scripts/verify-prototype-safety.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: sensoped-ai-neuentwicklung
          fetch-depth: 0
      - name: Fetch dated restore snapshot
        run: git fetch origin backup/sensoped-ai-neuentwicklung-2026-11-27-patient-view
      - name: Confirm snapshot files exist
        run: |
          SNAPSHOT=origin/backup/sensoped-ai-neuentwicklung-2026-11-27-patient-view
          for path in src/App.jsx src/main.jsx src/style.css package.json worker.js; do
            git cat-file -e "$SNAPSHOT:$path"
          done
      - name: Restore snapshot into temporary directory
        run: |
          mkdir -p /tmp/sensoped-restore
          git archive origin/backup/sensoped-ai-neuentwicklung-2026-11-27-patient-view | tar -x -C /tmp/sensoped-restore
      - name: Build restored snapshot
        working-directory: /tmp/sensoped-restore
        run: |
          npm install
          npm run build
      - name: Confirm backup tags
        run: |
          TAGS=$(git tag -l 'backup-*')
          if [ -z "$TAGS" ]; then
            echo "No dated backup tags yet."
          else
            echo "$TAGS"
          fi
